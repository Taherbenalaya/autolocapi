spring.application.name=autoloc-api

# Connexion à la base de données MySQL
# NOTE : Mettez à jour ces informations selon votre configuration locale :
# - spring.datasource.url : port (3306 par défaut) et nom de la base
# - spring.datasource.username : utilisateur MySQL (par défaut root)
# - spring.datasource.password : mot de passe MySQL (ou variable d'environnement DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:votre_mot_de_passe}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
