spring.application.name=autoloc-api

# Connexion a la base de donnees MySQL
# NOTE : Base renommee en autoloc_db2 pour recreer un schema propre sans conflit
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db2?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:votre_mot_de_passe}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
