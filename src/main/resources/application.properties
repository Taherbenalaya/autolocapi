spring.application.name=autoloc-api

# Port du serveur et contexte racine de l'API REST
server.port=8081
server.servlet.context-path=/api

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.datasource.url=jdbc:mysql://localhost:3332/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Taher99187502-kk

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
